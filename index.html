<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Барои Азимҷони далбаёб</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a2e; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            text-align: center; 
            overflow: hidden; 
        }
        .container { 
            background: #16213e; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7); 
            max-width: 90%; 
            width: 400px; 
            border: 2px solid #e94560;
            box-sizing: border-box;
        }
        h1 { color: #e94560; margin-bottom: 10px; font-size: 22px; }
        p { font-size: 15px; line-height: 1.5; color: #a2a8d3; }
        
        /* Услуби расм */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e94560;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }

        .btn { 
            background: #e94560; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 15px; 
            font-weight: bold; 
            width: 100%;
        }
        .btn:hover { background: #d93850; transform: scale(1.05); }
        
        #poem-page { display: none; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .poem-text { 
            font-size: 15px; 
            font-weight: bold; 
            color: #fff; 
            margin: 15px 0; 
            line-height: 1.5;
            font-style: italic; 
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid #43dde6;
            text-align: left;
        }
        .highlight { color: #43dde6; }
    </style>
</head>
